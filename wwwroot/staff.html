<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canTee - Quản lý căn tin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="trang-quản-lý">

    <aside id="sidebar" class="thanh-bên">
        <div class="thương-hiệu-bên">
            <span class="chữ-can">can</span>
            <span class="chữ-tee">Tee</span>
            <span class="chấm-vàng"></span>
            <span class="huy-hiệu-vai-trò">STAFF</span>
        </div>
        <nav class="điều-hướng-bên">
            <button onclick="navigate('dashboard')" id="navDashboard" class="mục-menu đang-chọn">
                <i class="fa-solid fa-gauge-high icon-vàng"></i><span>Tổng quan</span>
            </button>
            <button onclick="navigate('orders')" id="navOrders" class="mục-menu">
                <i class="fa-solid fa-clipboard-list"></i><span>Đơn hàng</span>
            </button>
            <button onclick="navigate('menu')" id="navMenu" class="mục-menu">
                <i class="fa-solid fa-utensils"></i><span>Thực đơn</span>
            </button>
            <button onclick="navigate('canteen')" id="navCanteen" class="mục-menu">
                <i class="fa-solid fa-store"></i><span>Căn tin</span>
            </button>
        </nav>
        <div class="chân-bên">
            <button onclick="doLogout()" class="nút-nguy-hiểm">Đăng xuất</button>
        </div>
    </aside>

    <main style="flex:1;min-width:0">
        <header class="đầu-trang-quản-lý">
            <div style="flex:1;display:flex;align-items:center;gap:12px">
                <span class="tiêu-đề-quản-lý" id="headerTitle">Tổng quan</span>
                <select id="canteenSelect" onchange="onCanteenChange()" class="chọn-căn-tin ẩn">
                    <option value="">-- Chọn căn tin --</option>
                </select>
            </div>
            <span class="tên-người-dùng-quản-lý" id="headerUser"></span>
        </header>

        <div class="nội-dung-quản-lý">

            <div id="viewDashboard">
                <div class="lưới-chỉ-số" id="statCards"></div>
                <div class="lưới-dashboard">
                    <div class="thẻ-trắng">
                        <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:12px">Đơn hàng gần đây</h3>
                        <div style="overflow-x:auto"><table class="bảng" id="recentOrdersBody"><thead><tr><th style="text-align:left;padding:8px">Mã</th><th style="text-align:left;padding:8px">Khách</th><th style="text-align:right;padding:8px">Tiền</th><th style="text-align:right;padding:8px">T.gian</th><th style="text-align:center;padding:8px">TT</th></tr></thead><tbody></tbody></table></div>
                    </div>
                    <div class="thẻ-trắng">
                        <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:12px">Sản phẩm bán chạy</h3>
                        <div id="topProductsList"></div>
                    </div>
                </div>
            </div>

            <div id="viewOrders" class="ẩn">
                <div class="nhóm-nút-lọc">
                    <button onclick="setOrderTab('kanban')" id="orderTabKanban" class="nút-tab đang-chọn">Đang xử lý</button>
                    <button onclick="setOrderTab('completed')" id="orderTabCompleted" class="nút-tab">Hoàn thành</button>
                    <button onclick="setOrderTab('cancelled')" id="orderTabCancelled" class="nút-tab">Đã hủy</button>
                </div>
                <div id="orderKanban" class="bảng-kanban"></div>
                <div id="orderTable" class="bảng-quản-lý ẩn">
                    <div class="khung-cuộn"><table class="bảng" id="orderTableBody"><thead><tr><th style="text-align:left;padding:12px">Mã</th><th style="text-align:left;padding:12px">Khách</th><th style="text-align:left;padding:12px">Món</th><th style="text-align:right;padding:12px">Tổng</th><th style="text-align:center;padding:12px">TT</th><th style="text-align:right;padding:12px">Thời gian</th></tr></thead><tbody></tbody></table></div>
                </div>
            </div>

            <div id="viewMenu" class="ẩn">
                <div class="nhóm-nút-lọc">
                    <button onclick="setMenuTab('categories')" id="menuTabCat" class="nút-tab đang-chọn">Danh mục</button>
                    <button onclick="setMenuTab('products')" id="menuTabProd" class="nút-tab">Sản phẩm</button>
                </div>
                <div id="menuCategoriesPanel">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
                        <button onclick="openCategoryForm()" class="nút-vàng"><i class="fa-solid fa-plus"></i>Thêm danh mục</button>
                    </div>
                    <div class="bảng-quản-lý">
                        <div class="khung-cuộn"><table class="bảng" id="categoriesTableBody"><thead><tr><th style="text-align:left;padding:12px">Tên danh mục</th><th style="text-align:center;padding:12px">Thứ tự</th><th style="text-align:center;padding:12px">Số món</th><th style="text-align:right;padding:12px">Hành động</th></tr></thead><tbody></tbody></table></div>
                    </div>
                </div>
                <div id="menuProductsPanel" class="ẩn">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
                        <button onclick="openProductForm()" class="nút-vàng"><i class="fa-solid fa-plus"></i>Thêm món</button>
                    </div>
                    <div id="menuCategories" class="thanh-danh-mục"></div>
                    <div id="menuProducts"></div>
                </div>
            </div>

            <div id="viewCanteen" class="ẩn" style="max-width:672px">
                <div class="thẻ-trắng" style="margin-bottom:24px">
                    <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:16px">Thông tin căn tin</h3>
                    <form id="canteenForm" onsubmit="saveCanteen(event)">
                        <div class="lưới-form-hai-cột" style="margin-bottom:12px">
                            <div><label class="nhãn-ô">Tên</label><input id="canteenName" class="ô-nhập"></div>
                            <div><label class="nhãn-ô">Email</label><input id="canteenEmail" class="ô-nhập"></div>
                        </div>
                        <div style="margin-bottom:12px"><label class="nhãn-ô">Địa chỉ</label><input id="canteenAddr" class="ô-nhập"></div>
                        <div class="lưới-form-hai-cột" style="margin-bottom:12px">
                            <div><label class="nhãn-ô">SĐT</label><input id="canteenPhone" class="ô-nhập"></div>
                            <div><label class="nhãn-ô">Trạng thái</label><select id="canteenStatus" class="ô-chọn"><option value="Active">Đang hoạt động</option><option value="Suspended">Tạm ngưng</option></select></div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <button type="submit" class="nút-vàng">Lưu</button>
                            <label class="nút-xám" style="cursor:pointer"><i class="fa-solid fa-image"></i>Ảnh<input type="file" accept="image/*" onchange="uploadCanteenImage(this)" class="ẩn"></label>
                        </div>
                    </form>
                </div>
                <div class="thẻ-trắng">
                    <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:16px">Giờ hoạt động</h3>
                    <div id="operatingHoursGrid"></div>
                </div>
            </div>

        </div>
    </main>

    <div id="categoryModal" class="lớp-phủ-modal ẩn">
        <div class="hộp-modal">
            <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:16px" id="catModalTitle">Thêm danh mục</h3>
            <form onsubmit="saveCategory(event)">
                <input type="hidden" id="catEditId">
                <div style="margin-bottom:12px"><label class="nhãn-ô">Tên</label><input id="catName" required class="ô-nhập"></div>
                <div style="margin-bottom:12px"><label class="nhãn-ô">Thứ tự</label><input id="catOrder" type="number" value="0" class="ô-nhập"></div>
                <div style="display:flex;align-items:center;gap:8px;padding-top:8px">
                    <button type="submit" class="nút-vàng" style="flex:1">Lưu</button>
                    <button type="button" onclick="closeCategoryForm()" class="nút-xám" style="flex:1">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <div id="productModal" class="lớp-phủ-modal ẩn">
        <div class="hộp-modal rộng dạng-form">
            <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:16px" id="prodModalTitle">Thêm món</h3>
            <form onsubmit="saveProduct(event)">
                <input type="hidden" id="prodEditId">
                <div style="margin-bottom:12px"><label class="nhãn-ô">Tên</label><input id="prodName" required class="ô-nhập"></div>
                <div style="margin-bottom:12px"><label class="nhãn-ô">Mô tả</label><textarea id="prodDesc" class="ô-nhập" rows="2"></textarea></div>
                <div class="lưới-form-hai-cột" style="margin-bottom:12px">
                    <div><label class="nhãn-ô">Giá</label><input id="prodPrice" type="number" required class="ô-nhập"></div>
                    <div><label class="nhãn-ô">Danh mục</label><select id="prodCategory" class="ô-chọn"></select></div>
                </div>
                <div style="margin-bottom:12px"><label class="nhãn-ô">Trạng thái</label><select id="prodStatus" class="ô-chọn"><option value="Available">Còn hàng</option><option value="OutOfStock">Hết hàng</option></select></div>
                <div style="margin-bottom:12px"><label class="nhãn-ô">Ảnh</label><input type="file" id="prodImage" accept="image/*" style="font-size:0.75rem"></div>
                <div style="display:flex;align-items:center;gap:8px;padding-top:8px">
                    <button type="submit" class="nút-vàng" style="flex:1">Lưu</button>
                    <button type="button" onclick="closeProductForm()" class="nút-xám" style="flex:1">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <div id="mgModal" class="lớp-phủ-modal ẩn">
        <div class="hộp-modal">
            <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:16px" id="mgModalTitle">Thêm nhóm</h3>
            <form onsubmit="saveModifierGroup(event)">
                <input type="hidden" id="mgEditId"><input type="hidden" id="mgProductId">
                <div style="margin-bottom:12px"><label class="nhãn-ô">Tên nhóm</label><input id="mgName" required class="ô-nhập"></div>
                <div class="lưới-form-hai-cột" style="margin-bottom:12px">
                    <div><label class="nhãn-ô">Bắt buộc</label><select id="mgRequired" class="ô-chọn"><option value="false">Không</option><option value="true">Có</option></select></div>
                    <div><label class="nhãn-ô">Chọn tối đa</label><input id="mgMaxSelected" type="number" value="1" class="ô-nhập"></div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding-top:8px">
                    <button type="submit" class="nút-vàng" style="flex:1">Lưu</button>
                    <button type="button" onclick="closeMgForm()" class="nút-xám" style="flex:1">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modModal" class="lớp-phủ-modal ẩn">
        <div class="hộp-modal">
            <h3 style="font-size:0.875rem;font-weight:900;color:var(--navy);margin-bottom:16px" id="modModalTitle">Thêm option</h3>
            <form onsubmit="saveModifier(event)">
                <input type="hidden" id="modEditId"><input type="hidden" id="modGroupId">
                <div style="margin-bottom:12px"><label class="nhãn-ô">Tên option</label><input id="modName" required class="ô-nhập"></div>
                <div class="lưới-form-hai-cột" style="margin-bottom:12px">
                    <div><label class="nhãn-ô">Giá thêm</label><input id="modPrice" type="number" value="0" class="ô-nhập"></div>
                    <div><label class="nhãn-ô">Mặc định</label><select id="modDefault" class="ô-chọn"><option value="false">Không</option><option value="true">Có</option></select></div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding-top:8px">
                    <button type="submit" class="nút-vàng" style="flex:1">Lưu</button>
                    <button type="button" onclick="closeModForm()" class="nút-xám" style="flex:1">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="thông-báo-toast">
        <i id="toastIcon" class="fa-solid fa-circle-info"></i>
        <span id="toastMessage">Thông báo</span>
    </div>

    <template id="template-stat-card">
        <div class="thẻ-chỉ-số">
            <div class="biểu-tượng-chỉ-số"><i class="fa-solid"></i></div>
            <div>
                <p class="nhãn-chỉ-số"></p>
                <p class="giá-trị-chỉ-số"></p>
            </div>
        </div>
    </template>

    <template id="template-recent-order-row">
        <tr>
            <td style="padding:8px;font-weight:700;color:var(--blue-main)" class="cột-mã-đơn"></td>
            <td style="padding:8px" class="cột-khách"></td>
            <td style="padding:8px;text-align:right;font-weight:600" class="cột-tiền"></td>
            <td style="padding:8px;text-align:right;color:var(--text-muted)" class="cột-thời-gian"></td>
            <td style="padding:8px;text-align:center" class="cột-trạng-thái"></td>
        </tr>
    </template>

    <template id="template-top-product-item">
        <div class="hàng-top-sp">
            <div style="display:flex;align-items:center;gap:8px">
                <span class="thứ-hạng"></span>
                <span class="tên-top-sp"></span>
            </div>
            <span class="số-bán"></span>
        </div>
    </template>

    <template id="template-kanban-column">
        <div class="cột-kanban">
            <div class="đầu-cột">
                <span class="tiêu-đề-cột"></span>
                <span class="đếm-cột"></span>
            </div>
            <div class="danh-sách-cột"></div>
        </div>
    </template>

    <template id="template-order-card-kanban">
        <div class="thẻ-đơn-kanban">
            <div class="đầu-thẻ-đơn">
                <span class="mã-đơn-kanban"></span>
                <span class="giờ-đơn-kanban"></span>
            </div>
            <p class="món-đơn-kanban"></p>
            <div class="dòng-tiền-kanban">
                <span class="tổng-tiền-kanban"></span>
                <span class="trạng-thái-thanh-toán-kanban"></span>
            </div>
            <div class="nhóm-nút-kanban">
                <button class="nút-kanban-nhỏ mũi-tên-trái"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="nút-kanban-nhỏ mũi-tên-phải"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="nút-kanban-nhỏ giao-hàng"><i class="fa-solid fa-check"></i> Giao</button>
                <button class="nút-kanban-nhỏ hủy-đơn"><i class="fa-solid fa-xmark"></i></button>
                <button class="nút-kanban-nhỏ thanh-toán-chưa"><i class="fa-solid fa-money-bill"></i></button>
            </div>
        </div>
    </template>

    <template id="template-completed-order-row">
        <tr>
            <td style="padding:12px;font-weight:700;color:var(--blue-main)" class="cột-mã-đơn"></td>
            <td style="padding:12px" class="cột-khách"></td>
            <td style="padding:12px;color:var(--text-muted);max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="cột-món"></td>
            <td style="padding:12px;text-align:right;font-weight:600" class="cột-tiền"></td>
            <td style="padding:12px;text-align:center" class="cột-trạng-thái"></td>
            <td style="padding:12px;text-align:right;color:var(--text-muted)" class="cột-thời-gian"></td>
        </tr>
    </template>

    <template id="template-category-row">
        <tr>
            <td style="padding:12px;font-weight:700;color:var(--text-dark)" class="cột-tên-dm"></td>
            <td style="padding:12px;text-align:center;color:var(--text-muted)" class="cột-thứ-tự"></td>
            <td style="padding:12px;text-align:center;font-weight:600;color:var(--blue-main)" class="cột-số-món"></td>
            <td style="padding:12px;text-align:right">
                <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px">
                    <button class="nút-bảng-nhỏ trong-bảng sửa nút-sửa-dm"><i class="fa-solid fa-pen"></i></button>
                    <button class="nút-bảng-nhỏ trong-bảng xóa nút-xóa-dm"><i class="fa-solid fa-trash"></i></button>
                </div>
            </td>
        </tr>
    </template>

    <template id="template-category-tab-admin">
        <button class="nút-tab" style="white-space:nowrap"></button>
    </template>

    <template id="template-product-row-admin">
        <div class="hàng-sản-phẩm">
            <div class="đầu-hàng-sp">
                <div class="thông-tin-sp">
                    <div class="ảnh-sp-nhỏ"><img src="" onerror="this.style.display='none'"></div>
                    <div style="flex:1">
                        <div style="display:flex;align-items:center;gap:8px">
                            <span class="tên-sp"></span>
                            <button class="nhãn nút-trạng-thái-sp" style="font-size:0.625rem;cursor:pointer"></button>
                        </div>
                        <p class="giá-sp"></p>
                    </div>
                </div>
                <div class="nhóm-nút-sp">
                    <button class="nút-bảng-nhỏ sửa nút-sửa-sp"><i class="fa-solid fa-pen"></i></button>
                    <button class="nút-bảng-nhỏ xóa nút-xóa-sp"><i class="fa-solid fa-trash"></i></button>
                    <button class="nút-bảng-nhỏ mở-rộng nút-mở-rộng-sp"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
            </div>
            <div class="khung-tùy-chọn-con ẩn thân-sản-phẩm">
                <div class="danh-sách-mg-sp" style="display:flex;flex-direction:column;gap:8px;font-size:0.75rem"></div>
                <button class="nút-xanh nút-thêm-nhóm-sp" style="margin-top:8px;font-size:0.625rem"><i class="fa-solid fa-plus" style="margin-right:4px"></i>Thêm nhóm</button>
            </div>
        </div>
    </template>

    <template id="template-modifier-group-admin">
        <div style="background:#f8fafc;border-radius:8px;padding:8px;margin-bottom:4px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                <span style="font-weight:700;color:var(--text-muted);font-size:0.75rem" class="tên-nhóm-mg"></span>
                <div style="display:flex;align-items:center;gap:4px;font-size:0.625rem">
                    <span style="color:var(--text-muted)" class="thông-tin-mg"></span>
                    <button class="nút-sửa-mg" style="color:var(--text-muted);background:none;border:none;cursor:pointer"><i class="fa-solid fa-pen"></i></button>
                    <button class="nút-xóa-mg" style="color:#f87171;background:none;border:none;cursor:pointer"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <div class="danh-sách-option-mg" style="margin-left:12px"></div>
            <button class="nút-thêm-option-mg" style="margin-top:4px;font-size:0.625rem;color:var(--blue-main);font-weight:700;background:none;border:none;cursor:pointer"><i class="fa-solid fa-plus" style="margin-right:2px"></i>Thêm option</button>
        </div>
    </template>

    <template id="template-modifier-option-admin">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
            <span style="color:var(--text-dark)" class="tên-option-admin"></span>
            <div style="display:flex;align-items:center;gap:4px">
                <span style="color:var(--text-muted)" class="giá-option-admin"></span>
                <button class="nút-sửa-option-admin" style="color:var(--text-muted);background:none;border:none;cursor:pointer;font-size:0.625rem"><i class="fa-solid fa-pen"></i></button>
                <button class="nút-xóa-option-admin" style="color:#f87171;background:none;border:none;cursor:pointer;font-size:0.625rem"><i class="fa-solid fa-times"></i></button>
            </div>
        </div>
    </template>

    <template id="template-operating-hours-row">
        <div class="dòng-giờ-mở">
            <span class="ngày-giờ"></span>
            <input type="time" value="" data-day="" data-field="open">
            <span style="font-size:0.75rem;color:var(--text-muted)">đến</span>
            <input type="time" value="" data-day="" data-field="close">
            <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--text-muted)">
                <input type="checkbox" data-day="" data-field="closed" style="width:12px;height:12px"> Đóng
            </label>
        </div>
    </template>

    <template id="template-order-status-badge">
        <span class="nhãn"></span>
    </template>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/staff.js"></script>
</body>
</html>
