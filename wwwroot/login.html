<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canTee - Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="trang-đăng-nhập">

    <section id="screenAuth" class="khung-chính-đăng-nhập">
        <div class="khung-xác-thực">

            <div id="authLeftPanel" class="panel-giới-thiệu">
                <div class="họa-tiết-to"></div>
                <div class="họa-tiết-vòng-lớn"></div>
                <div class="họa-tiết-nhỏ-2"></div>
                <div class="họa-tiết-nhỏ-1"></div>

                <div class="logo-xác-thực">
                    <span class="chữ-can">can</span>
                    <span class="chữ-tee">Tee</span>
                    <span class="chấm-vàng"></span>
                </div>

                <div class="thông-điệp-xác-thực">
                    <h1 id="authLeftTitle">Chào mừng đến với canTee!</h1>
                    <p id="authLeftDesc">Đăng nhập để đặt món ngon mỗi ngày</p>
                </div>

                <div class="chân-panel-giới-thiệu">
                    <span>Hệ thống đặt món căn tin online</span>
                    <span class="phiên-bản">v1.0</span>
                </div>
            </div>

            <div id="authRightPanel" class="panel-form">
                <div class="panel-form__nội-dung">
                    <div style="text-align:center">
                        <h2 class="tiêu-đề-form" id="authRightTitle">Đăng nhập</h2>
                    </div>

                    <div id="roleSelectorWrap" class="nhóm-chọn-vai-trò ẩn">
                        <div class="vỏ-chọn-vai-trò">
                            <button type="button" onclick="setRegisterRole('customer')" id="roleBtnCustomer" class="nút-vai-trò đang-chọn">Khách hàng</button>
                            <button type="button" onclick="setRegisterRole('canteen')" id="roleBtnCanteen" class="nút-vai-trò">Chủ Quầy / Căn tin</button>
                        </div>
                    </div>

                    <form id="authForm" onsubmit="handleSubmit(event)" class="panel-form__biểu-mẫu">
                        <div id="fieldFullName" class="nhóm-ô-nhập ẩn">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="inputFullName" placeholder="Họ và tên">
                        </div>

                        <div class="nhóm-ô-nhập">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="inputUsername" required placeholder="Tên đăng nhập">
                        </div>

                        <div id="fieldEmail" class="nhóm-ô-nhập ẩn">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="inputEmail" placeholder="Email">
                        </div>

                        <div class="nhóm-ô-nhập có-nút-xem">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="inputPassword" required placeholder="Mật khẩu">
                            <button type="button" onclick="togglePassword()" class="nút-xem-mật-khẩu"><i id="togglePwdIcon" class="fa-regular fa-eye"></i></button>
                        </div>

                        <div id="canteenExtraFields" class="ẩn" style="display:flex;flex-direction:column;gap:12px;padding-top:4px">
                            <div class="nhóm-ô-nhập">
                                <i class="fa-solid fa-store"></i>
                                <input type="text" id="inputCanteenName" placeholder="Tên Căn tin">
                            </div>
                            <div class="nhóm-ô-nhập">
                                <i class="fa-solid fa-location-dot"></i>
                                <input type="text" id="inputCanteenAddress" placeholder="Địa chỉ Căn tin">
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                                <div class="nhóm-ô-nhập">
                                    <i class="fa-solid fa-phone"></i>
                                    <input type="tel" id="inputCanteenPhone" placeholder="SĐT Căn tin">
                                </div>
                                <div class="nhóm-ô-nhập">
                                    <i class="fa-solid fa-at"></i>
                                    <input type="email" id="inputCanteenEmail" placeholder="Email Căn tin">
                                </div>
                            </div>
                        </div>

                        <div id="formError" class="khung-lỗi ẩn"></div>

                        <div class="khung-gửi-form">
                            <button type="submit" id="authSubmitBtn" class="nút-vàng">ĐĂNG NHẬP</button>
                            <p id="authToggleText" class="chuyển-chế-độ">
                                <span>Chưa có tài khoản? </span>
                                <a href="javascript:void(0)" onclick="toggleAuthMode()" class="liên-kết">Đăng ký</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="toast" class="thông-báo-toast">
        <i id="toastIcon" class="fa-solid fa-circle-info"></i>
        <span id="toastMessage">Thông báo</span>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
