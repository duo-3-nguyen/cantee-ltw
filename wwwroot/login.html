<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canTee - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter','sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#1068B2', blueHover: '#0d5a9e',
                            yellow: '#FFC418', yellowHover: '#E5B016',
                            navy: '#0a3d6b', grayBg: '#f4f6f8',
                            cardBg: '#ffffff',
                            textDark: '#1e293b', textMuted: '#64748b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar{display:none}
        .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        .fade-in{animation:fadeIn .25s ease-in-out forwards}
        @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
        .sliding-bg{background:linear-gradient(135deg,#1068B2 0%,#0d5a9e 40%,#0a4c8a 100%)}
    </style>
</head>
<body class="bg-brand-grayBg text-brand-textDark font-sans min-h-screen flex flex-col selection:bg-brand-blue selection:text-white">

    <section id="screenAuth" class="flex-1 flex items-center justify-center p-4 sm:p-8 fade-in">
        <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[600px] border border-gray-100">

            <!-- LEFT PANEL: Brand -->
            <div id="authLeftPanel" class="md:col-span-5 sliding-bg text-white p-8 sm:p-10 flex flex-col justify-between relative overflow-hidden">
                <div class="absolute -top-10 -left-10 w-40 h-40 bg-white/5 rounded-full blur-xl pointer-events-none"></div>
                <div class="absolute bottom-10 -right-10 w-48 h-48 bg-brand-yellow/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute top-1/4 right-6 w-10 h-10 border-2 border-brand-yellow/20 rotate-45 pointer-events-none"></div>
                <div class="absolute bottom-1/3 left-6 w-8 h-8 bg-brand-yellow/15 rotate-12 pointer-events-none"></div>

                <div class="flex items-center relative z-10">
                    <span class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">can</span>
                    <span class="text-2xl sm:text-3xl font-extrabold tracking-tight text-brand-yellow">Tee</span>
                    <span class="w-2 h-2 rounded-full bg-brand-yellow mb-3 inline-block"></span>
                </div>

                <div class="space-y-3 my-auto relative z-10 py-10 text-center md:text-left">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight" id="authLeftTitle">Chào mừng đến với canTee!</h1>
                    <p class="text-sm sm:text-base text-white/70 leading-relaxed font-normal" id="authLeftDesc">Đăng nhập để đặt món ngon mỗi ngày</p>
                </div>

                <div class="relative z-10 flex items-center justify-between text-[11px] text-white/50 pt-4 border-t border-white/10">
                    <span>Hệ thống đặt món căng tin online</span>
                    <span class="font-bold text-white/60">v1.0</span>
                </div>
            </div>

            <!-- RIGHT PANEL: Form -->
            <div id="authRightPanel" class="md:col-span-7 bg-white p-8 sm:p-12 flex flex-col justify-center">
                <div class="space-y-4">
                    <div class="text-center">
                        <h2 class="text-2xl sm:text-3xl font-black text-brand-blue tracking-tight" id="authRightTitle">Đăng nhập</h2>
                    </div>

                    <!-- Role Switcher (Register only) -->
                    <div id="roleSelectorWrap" class="hidden flex justify-center">
                        <div class="bg-slate-100 p-1 rounded-full border border-slate-200 inline-flex text-xs font-bold">
                            <button type="button" onclick="setRegisterRole('customer')" id="roleBtnCustomer" class="px-4 py-1.5 rounded-full bg-white text-brand-blue shadow-sm font-extrabold">Khách hàng</button>
                            <button type="button" onclick="setRegisterRole('canteen')" id="roleBtnCanteen" class="px-4 py-1.5 rounded-full text-slate-500 hover:text-slate-800">Chủ Quầy / Căng tin</button>
                        </div>
                    </div>

                    <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-3">
                        <!-- Full Name (Register only) -->
                        <div id="fieldFullName" class="hidden bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                            <i class="fa-regular fa-user text-slate-400 text-xs"></i>
                            <input type="text" id="inputFullName" placeholder="Họ và tên" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                        </div>

                        <!-- Username -->
                        <div class="bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                            <i class="fa-regular fa-user text-slate-400 text-xs"></i>
                            <input type="text" id="inputUsername" required placeholder="Tên đăng nhập" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                        </div>

                        <!-- Email (Register only) -->
                        <div id="fieldEmail" class="hidden bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                            <i class="fa-regular fa-envelope text-slate-400 text-xs"></i>
                            <input type="email" id="inputEmail" placeholder="Email" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                        </div>

                        <!-- Password -->
                        <div class="bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all relative">
                            <i class="fa-solid fa-lock text-slate-400 text-xs"></i>
                            <input type="password" id="inputPassword" required placeholder="Mật khẩu" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400 pr-8">
                            <button type="button" onclick="togglePassword()" class="absolute right-2 text-slate-400 hover:text-slate-600 p-1"><i id="togglePwdIcon" class="fa-regular fa-eye text-xs"></i></button>
                        </div>

                        <!-- Canteen Owner Registration Fields -->
                        <div id="canteenExtraFields" class="hidden space-y-3 pt-1">
                            <div class="bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                                <i class="fa-solid fa-store text-slate-400 text-xs"></i>
                                <input type="text" id="inputCanteenName" placeholder="Tên Căng tin" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                            </div>
                            <div class="bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                                <i class="fa-solid fa-location-dot text-slate-400 text-xs"></i>
                                <input type="text" id="inputCanteenAddress" placeholder="Địa chỉ Căng tin" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                                    <i class="fa-solid fa-phone text-slate-400 text-xs"></i>
                                    <input type="tel" id="inputCanteenPhone" placeholder="SĐT Căng tin" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                                </div>
                                <div class="bg-slate-100/90 rounded-lg px-3.5 py-2.5 flex items-center gap-3 border border-transparent focus-within:border-brand-blue focus-within:bg-white transition-all">
                                    <i class="fa-solid fa-at text-slate-400 text-xs"></i>
                                    <input type="email" id="inputCanteenEmail" placeholder="Email Căng tin" class="bg-transparent text-xs sm:text-sm text-slate-800 outline-none w-full font-medium placeholder-slate-400">
                                </div>
                            </div>
                        </div>

                        <!-- Error message -->
                        <div id="formError" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3"></div>

                        <!-- Submit -->
                        <div class="pt-4 text-center">
                            <button type="submit" id="authSubmitBtn" class="w-full sm:w-auto bg-brand-yellow hover:bg-brand-yellowHover text-brand-navy font-black py-3 px-12 rounded-full shadow-md hover:shadow-lg transition-all text-xs tracking-wider uppercase active:scale-95 disabled:opacity-50">
                                ĐĂNG NHẬP
                            </button>
                            <p id="authToggleText" class="mt-3 text-xs text-brand-textMuted">
                                <span>Chưa có tài khoản? </span>
                                <a href="javascript:void(0)" onclick="toggleAuthMode()" class="text-brand-blue font-bold hover:underline">Đăng ký</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-brand-navy text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 z-50 text-xs font-semibold border border-slate-800">
        <i id="toastIcon" class="fa-solid fa-circle-info text-brand-yellow text-sm"></i>
        <span id="toastMessage">Thông báo</span>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        var authMode = 'login';
        var registerRole = 'customer';

        function getRedirectUrl(role) {
            if (role === 'Customer') return 'customer.html';
            if (role === 'Staff') return 'staff.html';
            return 'admin.html';
        }

        async function checkLoggedIn() {
            try {
                var user = await api.auth.me();
                window.location.href = getRedirectUrl(user.role);
            } catch(e) {}
        }
        checkLoggedIn();

        function toggleAuthMode() {
            if (authMode === 'login') {
                authMode = 'register';
                document.getElementById('authLeftTitle').innerText = "Tham gia canTee ngay!";
                document.getElementById('authLeftDesc').innerText = "Đăng ký tài khoản để khám phá thực đơn phong phú";
                document.getElementById('authRightTitle').innerText = "Tạo tài khoản";
                document.getElementById('roleSelectorWrap').classList.remove('hidden');
                document.getElementById('fieldFullName').classList.remove('hidden');
                document.getElementById('fieldEmail').classList.remove('hidden');
                document.getElementById('authSubmitBtn').innerText = "ĐĂNG KÝ";
                document.getElementById('authToggleText').innerHTML = '<span>Đã có tài khoản? </span><a href="javascript:void(0)" onclick="toggleAuthMode()" class="text-brand-blue font-bold hover:underline">Đăng nhập</a>';
                document.getElementById('formError').classList.add('hidden');
                if (registerRole === 'canteen') {
                    document.getElementById('canteenExtraFields').classList.remove('hidden');
                }
            } else {
                authMode = 'login';
                document.getElementById('authLeftTitle').innerText = "Chào mừng đến với canTee!";
                document.getElementById('authLeftDesc').innerText = "Đăng nhập để đặt món ngon mỗi ngày";
                document.getElementById('authRightTitle').innerText = "Đăng nhập";
                document.getElementById('roleSelectorWrap').classList.add('hidden');
                document.getElementById('fieldFullName').classList.add('hidden');
                document.getElementById('fieldEmail').classList.add('hidden');
                document.getElementById('canteenExtraFields').classList.add('hidden');
                document.getElementById('authSubmitBtn').innerText = "ĐĂNG NHẬP";
                document.getElementById('authToggleText').innerHTML = '<span>Chưa có tài khoản? </span><a href="javascript:void(0)" onclick="toggleAuthMode()" class="text-brand-blue font-bold hover:underline">Đăng ký</a>';
                document.getElementById('formError').classList.add('hidden');
            }
        }

        function setRegisterRole(role) {
            registerRole = role;
            var btnCust = document.getElementById('roleBtnCustomer');
            var btnCant = document.getElementById('roleBtnCanteen');
            var cFields = document.getElementById('canteenExtraFields');
            if (role === 'customer') {
                btnCust.className = "px-4 py-1.5 rounded-full bg-white text-brand-blue shadow-sm font-extrabold";
                btnCant.className = "px-4 py-1.5 rounded-full text-slate-500 hover:text-slate-800";
                cFields.classList.add('hidden');
                document.getElementById('authSubmitBtn').innerText = 'ĐĂNG KÝ';
            } else {
                btnCant.className = "px-4 py-1.5 rounded-full bg-white text-brand-blue shadow-sm font-extrabold";
                btnCust.className = "px-4 py-1.5 rounded-full text-slate-500 hover:text-slate-800";
                cFields.classList.remove('hidden');
                document.getElementById('authSubmitBtn').innerText = 'GỬI YÊU CẦU';
            }
        }

        function togglePassword() {
            var pwd = document.getElementById('inputPassword');
            var icon = document.getElementById('togglePwdIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-xs';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-regular fa-eye text-xs';
            }
        }

        function setError(msg) {
            var el = document.getElementById('formError');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function clearError() {
            document.getElementById('formError').classList.add('hidden');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            clearError();

            var btn = document.getElementById('authSubmitBtn');
            btn.disabled = true;
            btn.innerText = 'Đang xử lý...';

            try {
                if (authMode === 'login') {
                    var username = document.getElementById('inputUsername').value.trim();
                    var password = document.getElementById('inputPassword').value;
                    if (!username || !password) { setError('Vui lòng nhập đầy đủ thông tin.'); btn.disabled = false; updateBtnText(); return; }
                    await api.auth.login(username, password);
                    var user = await api.auth.me();
                    showToast('Đăng nhập thành công!', 'success');
                    setTimeout(function() { window.location.href = getRedirectUrl(user.role); }, 800);
                } else {
                    var u = document.getElementById('inputUsername').value.trim();
                    var pw = document.getElementById('inputPassword').value;
                    var em = document.getElementById('inputEmail').value.trim();
                    var fn = document.getElementById('inputFullName').value.trim();

                    if (registerRole === 'customer') {
                        if (!u || !pw || !em || !fn) { setError('Vui lòng nhập đầy đủ thông tin.'); btn.disabled = false; updateBtnText(); return; }
                        await api.auth.register({ username: u, password: pw, email: em, fullName: fn });
                        showToast('Đăng ký thành công! Vui lòng đăng nhập.', 'success');
                        toggleAuthMode();
                    } else {
                        var cn = document.getElementById('inputCanteenName').value.trim();
                        var ca = document.getElementById('inputCanteenAddress').value.trim();
                        var cp = document.getElementById('inputCanteenPhone').value.trim();
                        var ce = document.getElementById('inputCanteenEmail').value.trim();
                        if (!u || !pw || !em || !fn || !cn || !ca || !cp || !ce) { setError('Vui lòng nhập đầy đủ thông tin.'); btn.disabled = false; updateBtnText(); return; }
                        await api.registration.submit({
                            username: u, password: pw, email: em, fullName: fn,
                            canteenName: cn, canteenAddress: ca,
                            canteenPhoneNumber: cp, canteenEmail: ce
                        });
                        showToast('Yêu cầu đăng ký đã được gửi! Admin sẽ xét duyệt.', 'success');
                        document.getElementById('authForm').reset();
                        toggleAuthMode();
                    }
                }
            } catch(err) {
                setError(err.message || 'Có lỗi xảy ra, vui lòng thử lại.');
                showToast(err.message || 'Lỗi kết nối', 'error');
            }

            btn.disabled = false;
            updateBtnText();
        }

        function updateBtnText() {
            var btn = document.getElementById('authSubmitBtn');
            if (authMode === 'login') btn.innerText = 'ĐĂNG NHẬP';
            else if (registerRole === 'canteen') btn.innerText = 'GỬI YÊU CẦU';
            else btn.innerText = 'ĐĂNG KÝ';
        }
    </script>
</body>
</html>
